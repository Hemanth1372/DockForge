services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockforge-7e0746a517250794-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - 0=[object Object]
      - 1=[object Object]
      - 2=[object Object]
      - 3=[object Object]
      - DATABASE_URL=postgresql://user:password@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dockforge-network

  postgres:
    image: postgres:15-alpine
      container_name: dockforge-7e0746a517250794-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=dockforge_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dockforge-network

networks:
  dockforge-network:
    driver: bridge

volumes:
  postgres_data:
